name: CI and deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'backend'
        run: npx prisma generate
      - name: Lint
        run: npm run lint:check
      - name: Unit tests
        if: matrix.app == 'backend'
        run: npm test -- --runInBand
      - name: Build
        env:
          JWT_SECRET: ci-only-secret-not-used-outside-github-actions
          NEXT_PUBLIC_API_URL: https://datxe.linuxunity.com/api
          NEXT_PUBLIC_WS_URL: https://datxe.linuxunity.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ vars.NEXT_PUBLIC_FACEBOOK_APP_ID }}
        run: npm run build

  images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          build-args: |
            ${{ matrix.app == 'frontend' && 'NEXT_PUBLIC_API_URL=https://datxe.linuxunity.com/api' || '' }}
            ${{ matrix.app == 'frontend' && 'NEXT_PUBLIC_WS_URL=https://datxe.linuxunity.com' || '' }}
            ${{ matrix.app == 'frontend' && format('NEXT_PUBLIC_GOOGLE_CLIENT_ID={0}', vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID) || '' }}
            ${{ matrix.app == 'frontend' && format('NEXT_PUBLIC_FACEBOOK_APP_ID={0}', vars.NEXT_PUBLIC_FACEBOOK_APP_ID) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/datxe-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/datxe-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -P "$VPS_PORT" docker-compose.prod.yml nginx.prod.conf "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          scp -P "$VPS_PORT" scripts/deploy-vps.sh "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/scripts/"
      - name: Pull images and deploy with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_NAMESPACE: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && chmod 700 scripts/deploy-vps.sh && scripts/deploy-vps.sh '$IMAGE_TAG' '$GHCR_NAMESPACE' 'datxe.linuxunity.com'"
