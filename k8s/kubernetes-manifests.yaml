apiVersion: v1
kind: Namespace
metadata:
  name: car-rental-system

---
# Persistent Volume Claim for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: car-rental-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PostgreSQL Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: car-rental-system
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: car-rental-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: supersecurepassword123
            - name: POSTGRES_DB
              value: car_rental
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# Redis Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: car-rental-system
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: car-rental-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
# Backend (NestJS API) Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: car-rental-system
spec:
  ports:
    - port: 5000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: car-rental-system
spec:
  # Local file storage requires one replica on one VPS. Move to shared S3 before scaling horizontally.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: registry.linuxunity.com/car-rental/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:supersecurepassword123@db:5432/car_rental?schema=public
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SECRET
              value: supersecretjwtkey987654321!
            - name: PORT
              value: "5000"
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: FILE_PUBLIC_BASE_URL
              value: https://datxe.linuxunity.com
            - name: AWS_SES_EMAIL_SENDER
              value: noreply@datxe.linuxunity.com
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/vehicles
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: uploads
          hostPath:
            path: /opt/datxe/data/uploads
            type: DirectoryOrCreate

---
# Frontend (Next.js 15) Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: car-rental-system
spec:
  ports:
    - port: 3000
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: car-rental-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.linuxunity.com/car-rental/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://datxe.linuxunity.com/api
            - name: PORT
              value: "3000"

---
# Ingress Controller Configuration for datxe.linuxunity.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-rental-ingress
  namespace: car-rental-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: datxe.linuxunity.com
      http:
        paths:
          # API Routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          # Frontend Routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
