version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: car-rental-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecurepassword123
      POSTGRES_DB: car_rental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: car-rental-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: car-rental-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car-rental-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:supersecurepassword123@db:5432/car_rental?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey987654321!
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword123
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=car-rental-bucket
      - AWS_SES_EMAIL_SENDER=noreply@datxe.linuxunity.com
      - MOMO_PARTNER_CODE=MOMO_MOCK_PARTNER
      - MOMO_ACCESS_KEY=MOMO_MOCK_ACCESS
      - MOMO_SECRET_KEY=MOMO_MOCK_SECRET
      - MOMO_API_URL=https://test-payment.momo.vn/v2/gateway/api/create
      - PAYOS_CLIENT_ID=mock_payos_client_id
      - PAYOS_API_KEY=mock_payos_api_key
      - PAYOS_CHECKSUM_KEY=mock_payos_checksum_key
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car-rental-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://datxe.linuxunity.com/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: car-rental-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  miniodata:
